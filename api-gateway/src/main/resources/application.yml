server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service        # lb = load balanced via Eureka
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: book-service
          uri: lb://book-service
          predicates:
            - Path=/api/books/**
          filters:
            - StripPrefix=0
            - AuthFilter  # custom JWT filter (see below)

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

