server:
  port: 8081

spring:
  application:
    name: auth-service      # must match Eureka registration name
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/auth_db    # local postgres!
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET}   # Base64-encoded, >= 32 bytes. See .env.example
  expiration: 86400000  # 24h in ms
